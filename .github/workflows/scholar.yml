name: Update Scholar figures

# Google Scholar blocks GitHub runners, so the daily update runs from a Mac
# and pushes scholar.json itself. This workflow stays for manual runs.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scholar-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        # scholarly 1.7.11 imports bibtexparser 1.x APIs and passes `proxies=` to
        # httpx.Client, which httpx 0.28 removed. Keep both below the releases that broke it.
        run: pip install "scholarly==1.7.11" "bibtexparser<2" "httpx<0.28" free-proxy

      - name: Fetch Scholar stats
        id: fetch
        timeout-minutes: 10
        continue-on-error: true
        # Exit 2 means Scholar blocked the runner; any other failure is a crash.
        run: |
          set +e
          python -u scripts/fetch_scholar.py  # unbuffered, so a timeout still shows the attempts
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit $code

      - name: Report blocked fetch
        # An empty code means the step hit its timeout, which is also a block.
        if: steps.fetch.outcome != 'success' && (steps.fetch.outputs.code == '2' || steps.fetch.outputs.code == '')
        run: |
          echo "Google Scholar was unreachable from this runner (blocked or timed out)." >> "$GITHUB_STEP_SUMMARY"
          echo "Kept the last good assets/data/scholar.json." >> "$GITHUB_STEP_SUMMARY"

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- assets/data/scholar.json; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/scholar.json
          git commit -m "Update citation counts from Google Scholar [skip ci]"
          git push

      - name: Fail if the Scholar fetch crashed
        if: steps.fetch.outcome != 'success' && steps.fetch.outputs.code != '2' && steps.fetch.outputs.code != ''
        run: |
          echo "::error::fetch_scholar.py crashed (exit ${{ steps.fetch.outputs.code }}), so this was not a Scholar block. See the Fetch Scholar stats log."
          echo "fetch_scholar.py crashed (exit ${{ steps.fetch.outputs.code }}). This is a bug or a broken dependency, not a Scholar block." >> "$GITHUB_STEP_SUMMARY"
          exit 1
