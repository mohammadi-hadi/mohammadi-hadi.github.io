<style>
:root {
  color-scheme: light;
  --page: #f6f6f4;
  --surface: #ffffff;
  --ink: #1d1d1b;
  --muted: #6b6b66;
  --line: #d9d9d4;
  --accent: #2f5d8a;
  --accent-ink: #ffffff;
  --bad: #a3322a;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #161615;
    --surface: #20201e;
    --ink: #ecebe6;
    --muted: #a3a29b;
    --line: #3a3a36;
    --accent: #8db4dc;
    --accent-ink: #10202f;
    --bad: #f08a80;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #161615; --surface: #20201e; --ink: #ecebe6; --muted: #a3a29b;
  --line: #3a3a36; --accent: #8db4dc; --accent-ink: #10202f; --bad: #f08a80;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--page); color: var(--ink);
  font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  display: flex; align-items: center; justify-content: center; padding: 16px;
}
form {
  width: 100%; max-width: 340px; background: var(--surface);
  border: 1px solid var(--line); border-radius: 10px; padding: 24px;
}
h1 { font-size: 17px; font-weight: 600; margin: 0 0 16px; }
label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
input[type=password] {
  width: 100%; font: inherit; color: var(--ink); background: var(--page);
  border: 1px solid var(--line); border-radius: 6px; padding: 9px 10px;
}
input[type=password]:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button {
  width: 100%; font: inherit; font-weight: 600; cursor: pointer;
  background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 6px; padding: 9px 12px;
}
button[disabled] { opacity: .6; cursor: progress; }
.hint { margin: 10px 0 0; font-size: 12px; color: var(--muted); }
#msg { min-height: 20px; margin: 12px 0 0; font-size: 13px; color: var(--bad); }
#msg.info { color: var(--muted); }
</style>
</head>

<script>
(function () {
  'use strict';
  /* unlock:start */
  function b64(s) {
    var bin = atob(s), out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }
  async function deriveKey(blob, password) {
    var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(password.normalize('NFC')), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({ name: 'PBKDF2', hash: 'SHA-256', salt: b64(blob.salt), iterations: blob.iter },
      base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  }
  async function decryptWith(blob, key) {
    var pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(blob.iv) }, key, b64(blob.ct));
    return new TextDecoder().decode(pt);
  }
  async function unlock(blob, password) {
    return decryptWith(blob, await deriveKey(blob, password));
  }
  /* unlock:end */

  function show(html) {
    document.open();
    document.write(html);
    document.close();
  }
  var blob = JSON.parse(document.getElementById('blob').textContent);
  var form = document.getElementById('f'), pw = document.getElementById('pw');
  var go = document.getElementById('go'), msg = document.getElementById('msg');

  if (!window.crypto || !crypto.subtle) {
    msg.textContent = 'This browser cannot decrypt the page (needs HTTPS and WebCrypto).';
    go.disabled = true;
    return;
  }

  // Nothing is stored: every visit asks for the password again.
  try { sessionStorage.removeItem('pk'); } catch (e) {}

  form.addEventListener('submit', async function (ev) {
    ev.preventDefault();
    if (go.disabled) return;
    var p = pw.value;
    if (!p) return;
    go.disabled = true;
    msg.className = 'info';
    msg.textContent = 'Unlocking...';
    var started = Date.now();
    try {
      var key = await deriveKey(blob, p);
      var html = await decryptWith(blob, key);
      pw.value = '';
      show(html);
    } catch (e) {
      await new Promise(function (r) { setTimeout(r, Math.max(0, 900 - (Date.now() - started))); });
      msg.className = '';
      msg.textContent = 'Wrong password';
      go.disabled = false;
      pw.select();
    }
  });
})();
</script>
